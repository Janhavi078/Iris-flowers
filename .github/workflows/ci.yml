name: Iris Classifier CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest

      - name: Build backend Docker image
        run: |
          docker build -t ghcr.io/janhavi078/iris-backend:${{ github.sha }} ./backend

      - name: Push backend Docker image
        run: |
          docker push ghcr.io/janhavi078/iris-backend:${{ github.sha }}


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Build frontend Docker image
        run: |
          docker build -t iris-frontend ./frontend


  deploy:
    name: Deploy to EC2
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE: ghcr.io/janhavi078/iris-backend:${{ github.sha }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key "$EC2_USERNAME@$EC2_HOST" << EOF
            docker pull $IMAGE

            docker stop iris-backend || true
            docker rm iris-backend || true

            docker run -d \
              --name iris-backend \
              -p 8000:8000 \
              $IMAGE

            sleep 5

            curl --fail http://localhost:8000/health
          EOF